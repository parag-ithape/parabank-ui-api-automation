# =====================================================================================================
#  ALL ParaBank locators, one section per page.
#
#  Format:      <page>.<element>.<type>=<strategy>:<value>
#               The first part of the key is the page: Locators.forPage("login") reads every "login.*" line.
#  Strategies:  id | name | css | xpath | linkText | partialLinkText | className | tagName
#  Prefer:      id > name > css > xpath (fastest and most stable first)
#  Dynamic:     use {0}, {1}... in the value and pass the values from code.
#  Rules:       keys must not contain spaces, ':' or '='. Escape a literal backslash as \\.
#               Every key must be unique: LocatorIntegrityTest fails the build on a duplicate,
#               on a line without a page section, or on a value it cannot parse.
#  Verified against the live site on 2026-11-14.
# =====================================================================================================


# -----------------------------------------------------------------------------------------------------
#  Common: widgets shared by many pages
# -----------------------------------------------------------------------------------------------------
common.page.title=css:#rightPanel h1.title
common.error.panel=css:#rightPanel .error
common.table.row.byText=xpath://table//tr[td[normalize-space()='{0}']]
common.menu.link.byText=linkText:{0}


# -----------------------------------------------------------------------------------------------------
#  Login page: login panel on the left of every page while logged out (index.htm, login.htm)
# -----------------------------------------------------------------------------------------------------
login.username.input=name:username
login.password.input=name:password
login.login.button=css:input[value='Log In']
login.register.link=linkText:Register
login.error.message=css:#rightPanel p.error


# -----------------------------------------------------------------------------------------------------
#  Register page (register.htm)
#  Element names = business field names, so "zip code" in a feature maps to register.zipCode.*
# -----------------------------------------------------------------------------------------------------
register.firstName.input=id:customer.firstName
register.lastName.input=id:customer.lastName
register.street.input=id:customer.address.street
register.city.input=id:customer.address.city
register.state.input=id:customer.address.state
register.zipCode.input=id:customer.address.zipCode
register.phone.input=id:customer.phoneNumber
register.ssn.input=id:customer.ssn
register.username.input=id:customer.username
register.password.input=id:customer.password
register.confirmPassword.input=id:repeatedPassword
register.register.button=css:#customerForm input[value='Register']

# Error shown under each field after submit
register.firstName.error=id:customer.firstName.errors
register.lastName.error=id:customer.lastName.errors
register.street.error=id:customer.address.street.errors
register.city.error=id:customer.address.city.errors
register.state.error=id:customer.address.state.errors
register.zipCode.error=id:customer.address.zipCode.errors
register.phone.error=id:customer.phoneNumber.errors
register.ssn.error=id:customer.ssn.errors
register.username.error=id:customer.username.errors
register.password.error=id:customer.password.errors
register.confirmPassword.error=id:repeatedPassword.errors

# All field errors at once, used to explain a refused registration
register.field.errors=css:#customerForm span.error

# Shown after a successful registration
register.welcome.text=css:#rightPanel h1.title + p


# -----------------------------------------------------------------------------------------------------
#  Accounts Overview page (overview.htm). The table body is filled by JavaScript after the page loads.
# -----------------------------------------------------------------------------------------------------
accounts-overview.page.title=css:#showOverview h1.title
accounts-overview.account.table=id:accountTable
accounts-overview.account.links=css:#accountTable tbody a


# -----------------------------------------------------------------------------------------------------
#  Left Menu: "Account Services" menu on the left of every page while logged in
# -----------------------------------------------------------------------------------------------------
left-menu.accounts.overview.link=linkText:Accounts Overview
left-menu.log.out.link=linkText:Log Out
