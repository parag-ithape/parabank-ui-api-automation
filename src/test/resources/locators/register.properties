# =====================================================================
#  Page: Register (register.htm)
#  Verified against the live site 2026-11-14.
#  Key names = business field names, so "zip code" in a feature maps to zipCode.* here.
# =====================================================================
firstName.input=id:customer.firstName
lastName.input=id:customer.lastName
street.input=id:customer.address.street
city.input=id:customer.address.city
state.input=id:customer.address.state
zipCode.input=id:customer.address.zipCode
phone.input=id:customer.phoneNumber
ssn.input=id:customer.ssn
username.input=id:customer.username
password.input=id:customer.password
confirmPassword.input=id:repeatedPassword
register.button=css:#customerForm input[value='Register']

# Error shown under each field after submit
firstName.error=id:customer.firstName.errors
lastName.error=id:customer.lastName.errors
street.error=id:customer.address.street.errors
city.error=id:customer.address.city.errors
state.error=id:customer.address.state.errors
zipCode.error=id:customer.address.zipCode.errors
phone.error=id:customer.phoneNumber.errors
ssn.error=id:customer.ssn.errors
username.error=id:customer.username.errors
password.error=id:customer.password.errors
confirmPassword.error=id:repeatedPassword.errors

# All field errors at once (span.error inside the form), used to explain a refused registration
field.errors=css:#customerForm span.error

# Shown after a successful registration
welcome.text=css:#rightPanel h1.title + p
