name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 20 * * *"            # nightly, 02:00 IST
  workflow_dispatch:                 # "Run workflow" button, with a choice of scenarios
    inputs:
      tags:
        description: Cucumber tag expression (e.g. @smoke, @LOG-01, @knownIssue)
        default: "not @knownIssue and not @wip"

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false               # a Firefox failure doesn't stop the Chrome run, and vice versa
      matrix:
        browser: [chrome, firefox]

    services:
      parabank:                      # a private ParaBank for every run: no shared data, no public-site outages
        image: parasoft/parabank:latest
        ports: ["8080:8080"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for ParaBank to start, then check registration
        run: |
          BASE=http://localhost:8080/parabank
          for i in $(seq 1 60); do
            if curl -sf "$BASE/index.htm" > /dev/null; then echo "ParaBank answers"; break; fi
            if [ "$i" = 60 ]; then echo "::error::ParaBank did not start within 5 minutes"; exit 1; fi
            sleep 5
          done

          # First visit to each page is slow (pages compile, database warms up)
          for page in index.htm register.htm login.htm about.htm "services/bank?_wadl"; do
            curl -s -o /dev/null -w "%{http_code}  %{time_total}s  $page\n" "$BASE/$page"
          done

          # Registers a throwaway customer over HTTP; prints a notice with the outcome.
          # $1 = label for the notice, $2 = "home" to open index.htm first like a visitor would
          register() {
            rm -f warmup.jar
            if [ "$2" = "home" ]; then curl -s -c warmup.jar -b warmup.jar "$BASE/index.htm" > /dev/null; fi
            curl -s -c warmup.jar -b warmup.jar "$BASE/register.htm" > /dev/null
            USERNAME="warm_${RANDOM}${RANDOM}"
            PAGE=$(curl -s -c warmup.jar -b warmup.jar -X POST "$BASE/register.htm" \
              --data-urlencode "customer.firstName=Warm" --data-urlencode "customer.lastName=Up" \
              --data-urlencode "customer.address.street=1 Test St" --data-urlencode "customer.address.city=Pune" \
              --data-urlencode "customer.address.state=MH" --data-urlencode "customer.address.zipCode=411001" \
              --data-urlencode "customer.phoneNumber=9000000000" --data-urlencode "customer.ssn=123-45-6789" \
              --data-urlencode "customer.username=$USERNAME" --data-urlencode "customer.password=Warm12345" \
              --data-urlencode "repeatedPassword=Warm12345")
            if echo "$PAGE" | grep -q "Welcome $USERNAME"; then
              echo "::notice title=ParaBank check::$1 -> registration WORKS"; return 0
            fi
            TITLE=$(echo "$PAGE" | grep -o '<h1 class="title">[^<]*' | head -1 | sed 's/.*>//')
            ERR=$(echo "$PAGE" | grep -o 'class="error">[^<]*' | head -2 | sed 's/.*>//' | tr '\n' ' ')
            echo "::notice title=ParaBank check::$1 -> registration refused. Title: $TITLE. Errors: $ERR"
            return 1
          }

          # Diagnosis: on the Docker ParaBank every registration answered "An internal error has occurred".
          # Each line below shows up as a notice on the run page.
          register "1. fresh container" || true
          register "2. after opening the home page first" home || true
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/services/bank/initializeDB")
          echo "::notice title=ParaBank check::3. initializeDB answered HTTP $CODE"
          register "4. after initializeDB" || true

          # ParaBank's own server log: the real reason for "An internal error has occurred"
          docker logs "${{ job.services.parabank.id }}" 2>&1 \
            | grep -E "Exception|Caused by|ERROR|SEVERE" | grep -v "^\s*at " | sort -u | head -12 \
            | while IFS= read -r line; do echo "::notice title=ParaBank server log::$line"; done
          exit 0

      - name: Run tests
        run: |
          set -o pipefail
          mvn -B clean test -Plocal \
            -Dbrowser=${{ matrix.browser }} -Dheadless=true -DdpThreads=2 \
            "-Dcucumber.filter.tags=${{ github.event.inputs.tags || 'not @knownIssue and not @wip' }}" \
            | tee mvn-output.log

      - name: Show results on the run page
        if: always()
        run: |
          LOG=target/logs/run.log
          {
            echo "## Results (${{ matrix.browser }})"
            echo '```'
            if [ -f "$LOG" ]; then
              grep -aE " - (RESULT|SUMMARY|REPORTS) " "$LOG" | sed -E 's/^.* - //'
            else
              echo "No test log: the run stopped before any scenario started. Last Maven errors:"
              grep -a "\[ERROR\]" mvn-output.log | head -20
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Each failure as an error annotation (shown at the top of the run page)
          if [ -f "$LOG" ]; then
            grep -aE " - FAILED " "$LOG" | sed -E 's/^.* - FAILED +//' | head -20 \
              | while IFS= read -r line; do echo "::error title=Failed (${{ matrix.browser }})::$line"; done
          fi
          if ! grep -aq "SUMMARY" "$LOG" 2>/dev/null; then
            grep -a "\[ERROR\]" mvn-output.log | head -5 \
              | while IFS= read -r line; do echo "::error title=Build error (${{ matrix.browser }})::$line"; done
          fi

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Collect reports
        if: always()
        run: |
          mkdir -p site
          cp -r target/allure-report/. site/ 2>/dev/null || true
          cp target/cucumber-report.html site/ 2>/dev/null || true

      - name: Keep reports and log as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.browser }}
          path: |
            site
            target/logs/run.log

      - name: Prepare the Chrome report for GitHub Pages
        if: always() && matrix.browser == 'chrome' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish-report:
    name: Publish report to GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Needs Settings → Pages → Source: "GitHub Actions". Until that is switched on, this job fails
    # without turning the whole workflow (and the README badge) red.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
